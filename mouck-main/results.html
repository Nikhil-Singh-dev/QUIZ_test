<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Results - Quiz Platform</title>
    <link rel="stylesheet" href="styles/results.css">
</head>
<body>
    <div class="results-container">
        <!-- Results Header -->
        <header class="results-header">
            <h1>Quiz Completed! 🎉</h1>
            <p class="subtitle" id="quizName">Quiz Name</p>
        </header>
        
        <!-- Main Results Section -->
        <div class="results-main">
            <!-- Score Circle Animation -->
            <div class="score-circle-container">
                <svg class="score-circle" viewBox="0 0 200 200">
                    <circle class="circle-background" cx="100" cy="100" r="90"></circle>
                    <circle class="circle-progress" cx="100" cy="100" r="90" id="scoreCircle"></circle>
                </svg>
                <div class="score-text">
                    <div class="score-number" id="scoreNumber">0%</div>
                    <div class="score-label">Your Score</div>
                </div>
            </div>
            
            <!-- Stats Cards -->
            <div class="stats-cards">
                <div class="stat-card correct">
                    <div class="stat-value" id="correctCount">0</div>
                    <div class="stat-label">Correct</div>
                </div>
                <div class="stat-card incorrect">
                    <div class="stat-value" id="incorrectCount">0</div>
                    <div class="stat-label">Incorrect</div>
                </div>
                <div class="stat-card time">
                    <div class="stat-value" id="timeTaken">0s</div>
                    <div class="stat-label">Time</div>
                </div>
            </div>
        </div>
        
        <!-- Answer Review -->
        <div class="answer-review">
            <h2>Answer Review</h2>
            <div class="answers-list" id="answersList">
                <div class="loading">Loading answers...</div>
            </div>
        </div>
        
        <!-- Action Buttons -->
        <div class="results-actions">
            <button class="btn-secondary" onclick="goToDashboard()">← Back to Dashboard</button>
            <button class="btn-primary" id="retakeBtn" onclick="retakeQuiz()">Retake Quiz 🔄</button>
        </div>
    </div>
    
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/site.js"></script>
    <script src="/js/results.js"></script>

</body>
</html>
